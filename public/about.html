<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 0;
      background: #2C2C2C;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 280px;
      padding: 28px 20px 24px;
      text-align: center;
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .name {
      font-size: 17px;
      font-weight: 700;
      margin: 6px 0 4px;
    }
    .version {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(26, 179, 148, 0.14);
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin: 4px 0 14px;
      border: 1px solid rgba(52, 211, 153, 0.22);
    }
    .copyright {
      font-size: 13px;
      color: #8e929c;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="App logo" id="logo" />
    <div class="name" id="name" data-default-name="JumpServerClient">JumpServerClient</div>
    <div class="version" id="version">Version</div>
    <p class="copyright" id="copyright">
      Copyright © JumpServer
    </p>
  </div>
  <script>
    const lang = (navigator.language || '').toLowerCase();
    const isZh = lang.startsWith('zh');
    const params = new URLSearchParams(window.location.search);
    const customName = (params.get('name') || '').trim();
    const isCustom = params.get('custom') === '1';
    const version = params.get('version') || '';
    const logoEl = document.getElementById('logo');
    const nameEl = document.getElementById('name');
    const versionEl = document.getElementById('version');
    const copyEl = document.getElementById('copyright');
    const appName = customName || nameEl.dataset.defaultName || 'JumpServerClient';

    document.title = isZh ? `关于 ${appName}` : `About ${appName}`;
    logoEl.alt = appName;
    versionEl.textContent = version ? `v${version}` : (isZh ? '版本信息' : 'Version');
    nameEl.textContent = appName;

    if (isCustom) {
      copyEl.hidden = true;
      copyEl.textContent = '';
    } else {
      copyEl.hidden = false;
      copyEl.textContent = isZh
        ? 'Copyright © JumpServer 保留所有权利'
        : 'Copyright © JumpServer. All Rights Reserved';
    }
  </script>
</body>
</html>
