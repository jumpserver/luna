<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 0;
      background: #2C2C2C;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 280px;
      padding: 28px 20px 24px;
      border-radius: 16px;
      background: linear-gradient(160deg, #1e2430, #1a1f29);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .name {
      font-size: 17px;
      font-weight: 700;
      margin: 6px 0 4px;
    }
    .version {
      font-size: 14px;
      color: #c7c9d1;
      margin-bottom: 12px;
    }
    .copyright {
      font-size: 13px;
      color: #8e929c;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="JumpServerClient" />
    <div class="name" id="name">JumpServerClient</div>
    <div class="version" id="version">Version</div>
    <p class="copyright" id="copyright">
      Copyright © JumpServer
    </p>
  </div>
  <script>
    const lang = (navigator.language || '').toLowerCase();
    const isZh = lang.startsWith('zh');
    const nameEl = document.getElementById('name');
    const versionEl = document.getElementById('version');
    const copyEl = document.getElementById('copyright');

    versionEl.textContent = isZh ? '版本信息' : 'Version';
    nameEl.textContent = 'JumpServerClient';
    copyEl.textContent = isZh
      ? 'Copyright © JumpServer 保留所有权利'
      : 'Copyright © JumpServer. All Rights Reserved';
  </script>
</body>
</html>
