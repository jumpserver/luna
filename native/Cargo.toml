[package]
name = "jumpserver-native"
version = "4.1.2"
description = "JumpServer Client native sidecars"
authors = ["JumpServer"]
license = "MIT"
repository = "https://github.com/jumpserver/clients"
edition = "2021"

[lib]
name = "jumpserver_native"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
crossterm = "0.29"
fast_image_resize = "6.0"
flate2 = "1.1.5"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4.31"
num_cpus = "1.16"
russh = "0.61.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
shiguredo_video_toolbox = { git = "https://github.com/shiguredo/video-toolbox-rs", branch = "develop" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
openh264 = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
