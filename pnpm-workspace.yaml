minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.33"
  - "@ai-sdk/provider-utils@5.0.16"
  - "@ai-sdk/vue@4.0.44"
  - ai@7.0.44
shellEmulator: true
nodeLinker: hoisted

overrides:
  "@electron/rebuild": 4.2.0
  # Nuxt aliases Intlify packages globally; keep core aligned with vue-i18n.
  "@intlify/core": 11.4.14
  "@intlify/core-base": 11.4.14
  "@intlify/shared": 11.4.14
  "vue-i18n": 11.4.14
  # builder 26.15.3 uses ElectronDownloadCacheMode, which @electron/get 3 does not export.
  "app-builder-lib@26.15.3>@electron/get": 5.1.0
  cpu-features: "-"
  # Security overrides (same-major compatible patched versions)
  "@nuxt/schema@4": "^4.6.4"
  "@tiptap/core@3": "^3.30.5"
  "brace-expansion@1": "^1.1.22"
  "brace-expansion@2": "^2.1.7"
  "brace-expansion@5": "^5.0.12"
  "devalue@5": "^5.9.3"
  "dompurify@3": "^3.4.17"
  "ejs@3": "^3.1.10"
  "esbuild@0.27": "^0.28.1"
  "fast-uri@3": "^3.1.9"
  "hosted-git-info@2": "^2.8.9"
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.18"
  "postcss-selector-parser@7": "^7.2.1"
  "semver@5": "^5.7.2"
  "serialize-javascript@7": "^7.1.4"
  "seroval@1": "^1.6.11"
  "shell-quote@1": "^1.12.0"
  "source-map-js@1": "^1.2.2"
  "tinypool@2": "^2.1.2"
  "tmp@<0.2.6": "^0.2.6"
  "undici@6": "^6.29.1"
  "undici@7": "^7.30.1"
  "vue@3": "^3.5.42"
  "zod@4": "^4.6.6"

packages:
  - .
  - electron
  - packages/*
  - applets/*

allowBuilds:
  "@bitdisaster/exe-icon-extractor": true
  "@parcel/watcher": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
  ssh2: false
  unrs-resolver: true
  vue-demi: true

patchedDependencies:
  appdmg@0.6.6: patches/appdmg@0.6.6.patch
  asciinema-player@3.17.0: patches/asciinema-player@3.17.0.patch
