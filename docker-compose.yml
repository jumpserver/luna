name: luna-dev

services:
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${JMS_DEV_PORT:-8888}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JMS_DEV_CORE: ${JMS_DEV_CORE:-host.docker.internal:8080}
      JMS_DEV_KOKO: ${JMS_DEV_KOKO:-host.docker.internal:5050}
      JMS_DEV_CHEN: ${JMS_DEV_CHEN:-host.docker.internal:8082}
      JMS_DEV_LUNA: ${JMS_DEV_LUNA:-host.docker.internal:3000}
      JMS_DEV_UI: ${JMS_DEV_UI:-host.docker.internal:9528}
      JMS_DEV_KAEL: ${JMS_DEV_KAEL:-host.docker.internal:8083}
      JMS_DEV_FACELIVE: ${JMS_DEV_FACELIVE:-host.docker.internal:5173}
      NGINX_ENVSUBST_FILTER: ^JMS_DEV_
    volumes:
      - ./dev/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
