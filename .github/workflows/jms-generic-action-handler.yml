on:
  push:
  pull_request:
    types: [opened, synchronize, closed]
  release:
    types: [created, published, released]

name: JumpServer repos generic handler

jobs:
  handle_pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: jumpserver/action-generic-handler@master
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          I18N_TOKEN: ${{ secrets.I18N_TOKEN }}

  handle_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: jumpserver/action-generic-handler@master
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          I18N_TOKEN: ${{ secrets.I18N_TOKEN }}

  handle_release:
    if: github.event_name == 'release' && github.event.action != 'released'
    runs-on: ubuntu-latest
    steps:
      - uses: jumpserver/action-generic-handler@master
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          I18N_TOKEN: ${{ secrets.I18N_TOKEN }}

  sync_release_downloads:
    # Promotion from prerelease to stable also emits the released event.
    if: >-
      github.event_name == 'release' && github.event.action == 'released'
      && (startsWith(github.event.release.tag_name, 'client-v')
      || startsWith(github.event.release.tag_name, 'weblite-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve product release version
        id: version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        shell: bash
        run: RELEASE_TARGET="${VERSION%%-v*}" node scripts/set-version.js

      - name: Download product release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TARGET: ${{ steps.version.outputs.target }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "$RELEASE_TARGET" = client ]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "JumpServer-${VERSION}-Setup.exe" \
              --pattern "JumpServer-${VERSION}-arm64.dmg" \
              --dir release-assets
            # Preserve legacy website download URLs in OSS only.
            mkdir -p upload/download/public
            cp "release-assets/JumpServer-${VERSION}-Setup.exe" \
              "upload/download/public/Client_${VERSION}_x64-setup.exe"
            cp "release-assets/JumpServer-${VERSION}-arm64.dmg" \
              "upload/download/public/Client_${VERSION}_aarch64.dmg"
            (
              cd upload/download/public
              sha256sum "Client_${VERSION}_x64-setup.exe" "Client_${VERSION}_aarch64.dmg" \
                > "Client_${VERSION}_SHA256SUMS"
            )
          else
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "JumpServer-WebLite-${VERSION}-x64.msi" \
              --dir release-assets
            mkdir -p upload/download/applets
            cp "release-assets/JumpServer-WebLite-${VERSION}-x64.msi" upload/download/applets/
            (
              cd upload/download/applets
              sha256sum "JumpServer-WebLite-${VERSION}-x64.msi" \
                > "JumpServer-WebLite-${VERSION}-x64_SHA256SUMS"
            )
          fi

      - name: Install ossutil
        run: |
          set -o pipefail
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload product downloads
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          ossutil config \
            -e oss-cn-beijing.aliyuncs.com \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L EN \
            -c ossutilconfig
          ossutil sync upload/ oss://jms-pkg/ -c ossutilconfig

      - name: Notify docker-web
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          RELEASE_TARGET: ${{ steps.version.outputs.target }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          jq -n \
            --arg event "${RELEASE_TARGET}-released" \
            --arg version "$VERSION" \
            --arg tag "$RELEASE_TAG" \
            '{event_type: $event, client_payload: {version: $version, tag: $tag}}' \
            > dispatch.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jumpserver/docker-web/dispatches \
            --data @dispatch.json
