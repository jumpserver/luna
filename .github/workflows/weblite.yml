name: Build and Release WebLite

on:
  push:
    tags: ["weblite-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          WebLite version or tag (e.g., v5.1.0 or weblite-v5.1.0-build2).
          Suffix tags upload to the base version release and replace matching assets.
        required: true
        type: string
      windows_sign_mode:
        description: Windows signing policy (optional continues unsigned on signing failure).
        required: false
        default: optional
        type: choice
        options:
          - optional
          - required
          - "off"

env:
  RELEASE_TARGET: weblite
  VERSION: >-
    ${{ github.event_name == 'workflow_dispatch'
    && inputs.version || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: weblite-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: prepare WebLite prerelease
    concurrency:
      group: weblite-release-prepare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Sync WebLite version
        id: version
        run: node scripts/set-version.js

      - name: Validate release handling
        run: node --test --test-concurrency=1 scripts/set-version.test.mjs scripts/github-release.test.mjs

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/github-release.mjs prepare

  build:
    needs: release
    concurrency:
      group: weblite-package-${{ needs.release.outputs.tag }}
      cancel-in-progress: false
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_MODE: ${{ inputs.windows_sign_mode || vars.WINDOWS_SIGN_MODE || 'optional' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Sync WebLite version
        run: node scripts/set-version.js

      - name: Verify WiX Toolset
        shell: pwsh
        run: Get-Command candle, light

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate WebLite
        run: >-
          pnpm exec oxlint applets/weblite packages/web-proxy &&
          pnpm exec eslint "applets/weblite/**/*.vue" "packages/web-proxy/**/*.vue" &&
          pnpm weblite:test &&
          pnpm --dir applets/weblite typecheck

      - name: Build WebLite installer
        env:
          SIGNPANEL_URL: ${{ secrets.SIGNPANEL_URL || vars.SIGNPANEL_URL }}
          SIGNPANEL_API_TOKEN: ${{ secrets.SIGNPANEL_API_TOKEN }}
        run: pnpm weblite:package

      - name: Verify WebLite MSI layout and runtime
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/weblite/*.msi -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) {
            throw "Expected one non-empty WebLite installer"
          }
          $installer = $installers[0].FullName
          $extract = Join-Path $env:RUNNER_TEMP "weblite-msi"
          $process = Start-Process msiexec.exe -ArgumentList "/a `"$installer`" /qn /norestart TARGETDIR=`"$extract`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WebLite MSI extraction failed: $($process.ExitCode)"
          }
          $executables = @(Get-ChildItem $extract -Filter weblite.exe -File -Recurse)
          if ($executables.Count -ne 1 -or !$executables[0].FullName.EndsWith('\JumpServer\WebLite\weblite.exe')) {
            throw "WebLite MSI must contain one executable directly in JumpServer\WebLite"
          }
          if ($env:WINDOWS_SIGN_MODE -ne "off") {
            foreach ($file in @($installer, $executables[0].FullName)) {
              try {
                $signature = Get-AuthenticodeSignature -LiteralPath $file -ErrorAction Stop
                if ($signature.Status -ne "Valid") {
                  throw "Invalid Authenticode signature for $($file): $($signature.Status)"
                }
              } catch {
                if ($env:WINDOWS_SIGN_MODE -eq "required") { throw }
                Write-Warning "$_"
              }
            }
          }
          $env:WEBLITE_EXECUTABLE = $executables[0].FullName
          pnpm --dir applets/weblite test:runtime
          if ($LASTEXITCODE -ne 0) {
            throw "WebLite MSI runtime checks failed"
          }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: weblite-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: release/weblite/*.msi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          BUILD_VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/github-release.mjs upload release/weblite Windows-x64
