name: Build and Release Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., v4.1.2)"
        required: true
        type: string
      product_name:
        description: "Custom product name for manual builds"
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]

env:
  VERSION: >-
    ${{ github.event_name == 'workflow_dispatch'
    && inputs.version || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: validate shared application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        run: pnpm typecheck && pnpm lint:check && pnpm test

  build:
    name: package ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            forge_args: --platform darwin --arch arm64
          - name: macOS-x64
            os: macos-15-intel
            forge_args: --platform darwin --arch x64
          - name: Linux-x64
            os: ubuntu-22.04
            forge_args: --platform linux --arch x64
          - name: Linux-arm64
            os: ubuntu-22.04-arm
            forge_args: --platform linux --arch arm64
          - name: Windows-x64
            os: windows-latest
            forge_args: --platform win32 --arch x64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Verify WiX Toolset
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: Get-Command candle, light

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version
        env:
          VERSION: ${{ env.VERSION }}
        run: pnpm set_version

      - name: Set custom product name
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.product_name != ''
        run: >-
          node scripts/set-product-name.mjs
          --name "${{ inputs.product_name }}"

      - name: Apply custom brand assets
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.product_name != ''
        env:
          CLIENT_BRAND_ASSETS_PASSPHRASE: >-
            ${{ secrets.CLIENT_BRAND_ASSETS_PASSPHRASE }}
        shell: bash
        run: |
          encrypted_assets=".github/brand-assets/client-brand-assets.tgz.enc"
          if [ ! -f "$encrypted_assets" ]; then
            echo "No encrypted brand assets found; using repository defaults."
            exit 0
          fi
          if [ -z "$CLIENT_BRAND_ASSETS_PASSPHRASE" ]; then
            echo "CLIENT_BRAND_ASSETS_PASSPHRASE is required."
            exit 1
          fi
          assets_root=".brand-assets-tmp"
          assets_dir="$assets_root/client-brand-assets"
          archive_path="$assets_root/client-brand-assets.tgz"
          rm -rf "$assets_root"
          mkdir -p "$assets_dir"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_assets" \
            -out "$archive_path" \
            -pass env:CLIENT_BRAND_ASSETS_PASSPHRASE
          tar -xzf "$archive_path" -C "$assets_dir"
          node scripts/apply-brand-assets.mjs --dir "$assets_dir"

      - name: Setup Apple certificate
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: pnpm setup_apple_cert

      - name: Prepare Electron resources
        run: pnpm electron:prepare

      - name: Build Electron artifacts
        run: pnpm --dir electron make -- ${{ matrix.forge_args }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/electron/make/**/*.dmg
            release/electron/make/**/*.zip
            release/electron/make/**/*.exe
            release/electron/make/**/*.msi
            release/electron/make/**/*.nupkg
            release/electron/make/**/RELEASES
            release/electron/make/**/*.deb
            release/electron/make/**/*.rpm

  release:
    name: create draft release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
