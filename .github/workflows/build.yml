name: Build and Release Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Client version or tag (e.g., v5.1.0 or client-v5.1.0-beta8).
          Suffix tags upload to the base version release and replace matching assets.
          Versions containing beta enable Electron DevTools.
        required: true
        type: string
      product_name:
        description: >-
          Custom product name for manual builds.
          Names containing beta also enable DevTools.
        required: false
        default: ""
        type: string
      windows_sign_mode:
        description: Windows signing policy (optional continues unsigned on signing failure).
        required: false
        default: optional
        type: choice
        options:
          - optional
          - required
          - "off"
  push:
    tags: ["client-v*"]

env:
  RELEASE_TARGET: client
  VERSION: >-
    ${{ github.event_name == 'workflow_dispatch'
    && inputs.version || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: validate shared application
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: electron/ssh-helper/go.mod
          cache-dependency-path: electron/ssh-helper/go.sum

      - name: Sync client version
        id: version
        run: node scripts/set-version.js

      - name: Validate release version handling
        run: node --test --test-concurrency=1 scripts/set-version.test.mjs scripts/github-release.test.mjs

      - name: Test Guacamole source build
        run: node --test --test-concurrency=1 packages/guacamole/scripts/build.test.mjs

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: >-
          pnpm exec oxlint ui packages electron scripts &&
          pnpm exec eslint "{ui,packages}/**/*.vue"

      - name: Validate web application
        run: pnpm typecheck:web && pnpm test:web

      - name: Install Chromium headless shell for Guacamole tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Validate Guacamole in Chromium
        env:
          NODE_OPTIONS: --max-old-space-size=2560
        run: pnpm test:guacamole

      - name: Validate Electron client
        run: pnpm typecheck:electron && pnpm test:electron

  release:
    name: prepare client prerelease
    needs: quality
    concurrency:
      group: client-release-prepare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
        run: node scripts/github-release.mjs prepare

  build:
    name: package ${{ matrix.name }}
    needs: [quality, release]
    concurrency:
      group: client-package-${{ needs.quality.outputs.tag }}-${{ matrix.name }}
      cancel-in-progress: false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            forge_args: --platform darwin --arch arm64
          - name: macOS-x64
            os: macos-15-intel
            forge_args: --platform darwin --arch x64
          - name: Linux-x64
            os: ubuntu-22.04
            forge_args: --platform linux --arch x64
          - name: Linux-arm64
            os: ubuntu-22.04-arm
            forge_args: --platform linux --arch arm64
          - name: Windows-x64
            os: windows-latest
            forge_args: --platform win32 --arch x64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_SIGN_MODE: ${{ inputs.windows_sign_mode || vars.WINDOWS_SIGN_MODE || 'optional' }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: electron/ssh-helper/go.mod
          cache-dependency-path: electron/ssh-helper/go.sum

      - name: Install Linux packaging dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Verify WiX Toolset
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: Get-Command candle, light

      - name: Sync version
        run: node scripts/set-version.js

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Validate packaging configuration
        if: startsWith(matrix.os, 'windows') || startsWith(matrix.os, 'macos')
        env:
          WINDOWS_SIGN_MODE: "off"
        run: pnpm --dir electron exec node --import tsx --test tests/forge-artifacts.test.ts

      - name: Set custom product name
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.product_name != ''
        run: >-
          node scripts/set-product-name.mjs
          --name "${{ inputs.product_name }}"

      - name: Apply custom brand assets
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.product_name != ''
        env:
          CLIENT_BRAND_ASSETS_PASSPHRASE: >-
            ${{ secrets.CLIENT_BRAND_ASSETS_PASSPHRASE }}
        shell: bash
        run: |
          encrypted_assets=".github/brand-assets/client-brand-assets.tgz.enc"
          if [ ! -f "$encrypted_assets" ]; then
            echo "No encrypted brand assets found; using repository defaults."
            exit 0
          fi
          if [ -z "$CLIENT_BRAND_ASSETS_PASSPHRASE" ]; then
            echo "CLIENT_BRAND_ASSETS_PASSPHRASE is required."
            exit 1
          fi
          assets_root=".brand-assets-tmp"
          assets_dir="$assets_root/client-brand-assets"
          archive_path="$assets_root/client-brand-assets.tgz"
          rm -rf "$assets_root"
          mkdir -p "$assets_dir"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_assets" \
            -out "$archive_path" \
            -pass env:CLIENT_BRAND_ASSETS_PASSPHRASE
          tar -xzf "$archive_path" -C "$assets_dir"
          node scripts/apply-brand-assets.mjs --dir "$assets_dir"

      - name: Import Apple certificate
        if: startsWith(matrix.os, 'macos')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Select Apple signing identity
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          signing_identity=$(
            security find-identity -v -p codesigning \
              | sed -n 's/.*"\(Developer ID Application[^\"]*\)".*/\1/p' \
              | head -n 1
          )
          if [ -z "$signing_identity" ]; then
            echo "No Developer ID Application signing identity found."
            exit 1
          fi
          echo "::add-mask::$signing_identity"
          echo "CSC_NAME=$signing_identity" >> "$GITHUB_ENV"

      - name: Prepare Electron resources
        timeout-minutes: 10
        run: pnpm electron:prepare

      - name: Build Electron artifacts
        env:
          SIGNPANEL_URL: ${{ secrets.SIGNPANEL_URL || vars.SIGNPANEL_URL }}
          SIGNPANEL_API_TOKEN: ${{ secrets.SIGNPANEL_API_TOKEN }}
        run: pnpm --dir electron make -- ${{ matrix.forge_args }}

      - name: Verify Windows installers
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $installers = @(
            "release/electron/make/nsis/x64/*-Setup.exe",
            "release/electron/make/wix/x64/*.msi"
          )
          foreach ($pattern in $installers) {
            $files = @(Get-ChildItem -Path $pattern -File -ErrorAction Stop)
            if ($files.Count -ne 1 -or $files[0].Length -eq 0) {
              throw "Expected one non-empty installer matching $pattern"
            }
            if ($env:WINDOWS_SIGN_MODE -ne "off") {
              try {
                $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName -ErrorAction Stop
                if ($signature.Status -ne "Valid") {
                  throw "Invalid Authenticode signature for $($files[0].Name): $($signature.Status)"
                }
              } catch {
                if ($env:WINDOWS_SIGN_MODE -eq "required") { throw }
                Write-Warning "$_"
              }
            }
          }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/electron/make/**/*.dmg
            release/electron/make/**/*.exe
            release/electron/make/**/*.msi
            release/electron/make/**/*.deb
            release/electron/make/**/*.rpm

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
          BUILD_VERSION: ${{ needs.quality.outputs.version }}
        run: node scripts/github-release.mjs upload release/electron/make "${{ matrix.name }}"
